aid: arcserve
name: Arcserve
description: 'Arcserve is a data protection, backup, and disaster recovery software
  vendor that helps organizations safeguard business-critical data across cloud, on-premises,
  and hybrid environments. Its Unified Data Protection (UDP) platform combines backup,
  replication, high availability, immutable storage, and AI-assisted ransomware detection,
  alongside SaaS Backup for cloud application data and Replication and High Availability
  (RHA) for continuous availability. Arcserve sells through MSPs, resellers, and direct
  channels with a usage-based pricing model. Programmatic surfaces are product-internal
  (a SOAP API for RHA scenario control and HTTP/PowerShell control of the UDP Console)
  rather than a public developer API program. This profile was surfaced as a portfolio
  company of Norwest Venture Partners and enriched by the API Evangelist pipeline.'
